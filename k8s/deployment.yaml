apiVersion: apps/v1
kind: Deployment
metadata:
  name: ci-app
  labels:
    app: ci-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ci-app
  template:
    metadata:
      labels:
        app: ci-app
    spec:
      containers:
      - name: web
        image: eliot843/docker-ci-app:latest
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: production
